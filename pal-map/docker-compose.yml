version: "3.9"

services:
    electron-builder:
        image: electronuserland/builder:wine
        container_name: palmap-electron-builder
        working_dir: /electron
        volumes:
            - ./frontend/build:/frontend/build
            - ./electron:/electron
            - ./dist:/dist
        command: >
            bash -c "
            npm install &&
            npm run build &&
            npx electron-builder --win --x64 --config electron-builder.yml
            "
